{% extends 'base.html' %}

{% block content %}

<div class="auth-wrapper">
    <div class="auth-card">

        <h2>Login</h2>

        <!-- ✅ FIXED MESSAGE BLOCK -->
        {% if messages %}
            {% for message in messages %}
                <div class="{% if message.tags == 'success' %}success-box{% else %}error-box{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="input-row">
                <label>Username</label>
                <input type="text" name="username">
            </div>

            <div class="input-row">
                <label>Password</label>
                <input type="password" name="password">
            </div>

            <button type="submit" class="btn-auth">Login</button>
        </form>

        <p class="switch-link">
            Don’t have an account?
            <a href="{% url 'signup' %}">Sign Up</a>
        </p>

    </div>
</div>

{% endblock %}
